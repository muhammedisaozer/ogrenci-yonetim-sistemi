<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Yeni Öğrenci Ekle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h2 class="mb-3">Yeni Öğrenci Ekle</h2>
      <hr>

      <!-- novalidate: Tarayıcının varsayılan pop-up'larını kapatıp Spring Validation mesajlarımızı gösterir -->
      <form th:action="@{/ogrenciler}" th:object="${ogrenci}" method="POST" novalidate>

        <div class="mb-3">
          <label class="form-label">Ad</label>
          <input type="text" th:field="*{ad}" class="form-control" placeholder="Öğrencinin adını girin" />
          <p class="text-danger small mt-1" th:if="${#fields.hasErrors('ad')}" th:errors="*{ad}"></p>
        </div>

        <div class="mb-3">
          <label class="form-label">Soyad</label>
          <input type="text" th:field="*{soyad}" class="form-control" placeholder="Öğrencinin soyadını girin" />
          <p class="text-danger small mt-1" th:if="${#fields.hasErrors('soyad')}" th:errors="*{soyad}"></p>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" th:field="*{email}" class="form-control" placeholder="ornek@mail.com" />
          <p class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="mb-3">
          <label class="form-label">Bölüm</label>
          <input type="text" th:field="*{bolum}" class="form-control" placeholder="Bölümünü girin" />
          <p class="text-danger small mt-1" th:if="${#fields.hasErrors('bolum')}" th:errors="*{bolum}"></p>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Kaydet</button>
          <a th:href="@{/ogrenciler}" class="btn btn-secondary">İptal</a>
        </div>
      </form>

    </div>
  </div>
</div>
</body>
</html>
