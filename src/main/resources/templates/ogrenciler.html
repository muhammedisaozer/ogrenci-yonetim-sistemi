<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Öğrenci Yönetim Sistemi</title>
  <!-- Bootstrap CSS (Sayfanın güzel görünmesi için) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2>Öğrenci Listesi</h2>
  <hr>
  <a th:href="@{/ogrenciler/yeni}" class="btn btn-primary mb-3">Yeni Öğrenci Ekle</a>
  <!-- ARAMA ÇUBUĞU -->
  <form th:action="@{/ogrenciler}" method="get" class="mb-3">
    <div class="input-group">
      <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Ad, soyad, email veya bölüm ara...">
      <button type="submit" class="btn btn-secondary">Ara</button>
      <a th:href="@{/ogrenciler}" class="btn btn-outline-secondary">Temizle</a>
    </div>
  </form>

  <!-- Gelecekte buraya 'Yeni Öğrenci Ekle' butonu koyacağız -->

  <table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
    <tr>
      <th>Ad</th>
      <th>Soyad</th>
      <th>Email</th>
      <th>Bölüm</th>
      <th>İşlemler</th>
    </tr>
    </thead>
    <tbody>
    <!-- Veri tabanındaki her bir öğrenci için bu satır tekrarlanacak -->
    <tr th:each="ogrenci : ${ogrenciler}">
      <td th:text="${ogrenci.ad}"></td>
      <td th:text="${ogrenci.soyad}"></td>
      <td th:text="${ogrenci.email}"></td>
      <td th:text="${ogrenci.bolum}"></td>
      <td>
        <a th:href="@{/ogrenciler/duzenle/{id}(id=${ogrenci.id})}" class="btn btn-sm btn-info text-white">Düzenle</a>
        <a th:href="@{/ogrenciler/sil/{id}(id=${ogrenci.id})}" class="btn btn-sm btn-danger">Sil</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
